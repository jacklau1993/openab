name: PR Preview Build
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
      variant:
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned PR1582 image with agy 1.4.8
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.canary-agy
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jacklau1993/openab:pr1582-antigravity-agy1.4.8
